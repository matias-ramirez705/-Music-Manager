<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Manager</title>
    <!-- Favicon: nota musical sobre fondo verde -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}?v=88">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.svg') }}?v=88">
    <!-- Cache-busting: el ?v=88 fuerza al navegador a cargar fresco -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=88">
</head>
<body>
    <!-- ============================================
         BARRA SUPERIOR - Logo + Pestañas horizontales
         ============================================ -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="logo-icon">♫</span>
            <span class="logo-text">Music Manager</span>
        </div>
        <nav class="topbar-nav">
            <a href="/" class="tab {{ 'active' if active_tab == 'local' else '' }}">
                <span class="tab-icon">♪</span><span class="tab-label">Mi Música</span>
            </a>
            <a href="/duplicates" class="tab {{ 'active' if active_tab == 'duplicates' else '' }}">
                <span class="tab-icon">⧉</span><span class="tab-label">Duplicados</span>
            </a>
            <a href="/saved" class="tab {{ 'active' if active_tab == 'saved' else '' }}">
                <span class="tab-icon">★</span><span class="tab-label">Playlists Guardadas</span>
            </a>
            <a href="/compare" class="tab {{ 'active' if active_tab == 'compare' else '' }}">
                <span class="tab-icon">⇄</span><span class="tab-label">Comparar Playlist</span>
            </a>
            <a href="/editor" class="tab {{ 'active' if active_tab == 'editor' else '' }}">
                <span class="tab-icon">✎</span><span class="tab-label">Metadatos</span>
            </a>
            <a href="/organize" class="tab {{ 'active' if active_tab == 'organize' else '' }}">
                <span class="tab-icon">📁</span><span class="tab-label">Organizar</span>
            </a>
            <a href="/downloads" class="tab {{ 'active' if active_tab == 'downloads' else '' }}">
                <span class="tab-icon">⬇</span><span class="tab-label">Descargas FLAC</span>
            </a>
        </nav>
        <div class="topbar-right">
            <span class="version-tag">v2.7</span>
        </div>
    </header>

    <!-- ============================================
         CONTENIDO PRINCIPAL
         ============================================ -->
    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <!-- Reproductor flotante (visible cuando se esta reproduciendo algo) -->
    <div id="player-bar" class="player-bar hidden">
        <div class="player-artwork-wrapper">
            <img id="player-artwork" class="player-artwork" alt="">
            <div id="player-artwork-placeholder" class="player-artwork-placeholder">♪</div>
        </div>
        <div class="player-info">
            <span id="player-title">—</span>
            <span id="player-artist" class="player-artist">—</span>
        </div>
        <div class="player-controls">
            <button id="player-prev" class="player-btn" title="Retroceder 10s">◀◀</button>
            <button id="player-playpause" class="player-btn player-btn-main" title="Play/Pausa">▶</button>
            <button id="player-next" class="player-btn" title="Avanzar 10s">▶▶</button>
        </div>
        <div class="player-progress-wrapper">
            <span id="player-current-time" class="player-time">0:00</span>
            <div class="player-progress" id="player-progress">
                <div class="player-progress-filled" id="player-progress-filled"></div>
            </div>
            <span id="player-duration" class="player-time">0:00</span>
        </div>
        <div class="player-volume-wrapper">
            <span id="player-volume-icon" class="player-volume-icon" title="Silenciar">🔊</span>
            <input type="range" id="player-volume" class="player-volume" min="0" max="100" value="80" title="Volumen">
        </div>
        <button id="player-lyrics" class="player-btn" title="Ver letra" style="font-size:14px;">📖</button>
        <audio id="player-audio" style="display:none;"></audio>
        <button id="player-close" class="player-close" title="Cerrar">✕</button>
    </div>

    <!-- Toast para notificaciones -->
    <div id="toast" class="toast"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}?v=88"></script>
    <script src="{{ url_for('static', filename='js/player.js') }}?v=88"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
