# ============================================================================
#  Compila MusicManager.exe automáticamente en Windows (GitHub Actions).
#
#  - Push a main -> artefactos en la pestaña "Actions".
#  - Etiqueta v*  -> Release permanente con los archivos:
#      * MusicManager-portable-win64.zip (recomendado: exe + código fuente)
#      * MusicManager.exe               (archivo único, sin código fuente)
#      * checksums SHA256
#  - workflow_dispatch -> lanzable a mano.
#
#  IMPORTANTE: El .exe solo contiene el Python runtime + librerías.
#  Los módulos .py, templates/ y static/ van en el ZIP portable para
#  que el usuario pueda editarlos sin recompilar.
# ============================================================================

name: Compilar EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (sin pywebview para build)
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask mutagen requests Pillow spotipy python-dotenv Send2Trash pyinstaller

      - name: Compilar MusicManager.exe (archivo único)
        run: python -m PyInstaller MusicManager.spec --noconfirm

      - name: Compilar versión portable (carpeta)
        run: python -m PyInstaller MusicManager-portable.spec --noconfirm

      - name: Preparar carpeta portable con código fuente
        shell: pwsh
        run: |
          # Copiar los módulos .py, templates/ y static/ al dist portable
          # para que el usuario pueda editarlos sin recompilar
          Copy-Item -Recurse -Force app dist/MusicManager/app
          Copy-Item -Recurse -Force templates dist/MusicManager/templates
          Copy-Item -Recurse -Force static dist/MusicManager/static

          # Copiar run_desktop.bat y main.py como fallback
          Copy-Item -Force run_desktop.bat dist/MusicManager/ -ErrorAction SilentlyContinue
          Copy-Item -Force main.py dist/MusicManager/ -ErrorAction SilentlyContinue

          # Crear carpeta data/ vacía
          New-Item -ItemType Directory -Force -Path dist/MusicManager/data

      - name: Empaquetar portable en ZIP y generar checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/MusicManager -DestinationPath dist/MusicManager-portable-win64.zip
          $h1 = (Get-FileHash dist/MusicManager.exe -Algorithm SHA256).Hash
          $h2 = (Get-FileHash dist/MusicManager-portable-win64.zip -Algorithm SHA256).Hash
          "$h1  MusicManager.exe" | Out-File -Encoding ascii dist/MusicManager.exe.sha256
          "$h2  MusicManager-portable-win64.zip" | Out-File -Encoding ascii dist/MusicManager-portable-win64.zip.sha256
          echo "SHA256 del exe: $h1"
          echo "SHA256 del zip portable: $h2"

      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: MusicManager-exe
          path: |
            dist/MusicManager.exe
            dist/MusicManager.exe.sha256
            dist/MusicManager-portable-win64.zip
            dist/MusicManager-portable-win64.zip.sha256
          if-no-files-found: error

      - name: Crear Release (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MusicManager.exe
            dist/MusicManager.exe.sha256
            dist/MusicManager-portable-win64.zip
            dist/MusicManager-portable-win64.zip.sha256
          fail_on_unmatched_files: true
