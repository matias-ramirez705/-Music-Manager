    <!-- Vertical derecha -->
    <rect x="38" y="10" width="4" height="30" rx="1"/>
    <!-- Conector superior (bandera) -->
    <path d="M22 14 L42 10 L42 18 L22 22 Z"/>
    <!-- Cabezas de nota (ovalos) -->
    <ellipse cx="16" cy="44" rx="7" ry="5" transform="rotate(-20 16 44)"/>
    <ellipse cx="36" cy="40" rx="7" ry="5" transform="rotate(-20 36 40)"/>
  </g>
